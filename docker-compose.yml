services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: altaboard
      POSTGRES_PASSWORD: altaboard
      POSTGRES_DB: altaboard
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # No-auth app: loopback only, see README "Known limitations".
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altaboard -d altaboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One image, two commands. Migrations + seed run once before web starts.
  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://altaboard:altaboard@db:5432/altaboard
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      MOCK_BLIZZARD: ${MOCK_BLIZZARD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: npm run start
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://altaboard:altaboard@db:5432/altaboard
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      DEFAULT_REGION: ${DEFAULT_REGION:-eu}
      MOCK_BLIZZARD: ${MOCK_BLIZZARD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: npm run worker
    # A crashed worker must come back on its own, it is the only refresher.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://altaboard:altaboard@db:5432/altaboard
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      DEFAULT_REGION: ${DEFAULT_REGION:-eu}
      MOCK_BLIZZARD: ${MOCK_BLIZZARD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional: `docker compose --profile redis up`: Redis-backed cache upgrade path.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    # Same contract as web/db: loopback bind only, plus a password so LAN
    # peers cannot reach an unauthenticated Redis.
    command: redis-server --requirepass "${REDIS_PASSWORD:-altaboard-redis}"
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  db-data:
